<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#15122b;color:#fff3e4}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Museum of Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#15122b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fredoka:wght@500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@1,500;1,600&family=Lora:ital,wght@0,500;1,500&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: panggung 16:9 (peta, CG, adegan) dengan kotak dialog. Di layar lebar dialog menumpuk di panggung. Palet malam navy, cahaya amber. Satu tampilan gelap yang disengaja. */
:root {
  color-scheme: dark;
  --night: #15122b;
  --plum: #262050;
  --plum-2: #352c62;
  --rose: #ff8fa8;
  --gold: #ffd38a;
  --amber: #ffb35c;
  --cream: #fff3e4;
  --muted: #b9afd6;
  --mint: #6ee7a0;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-card: "Lora", Georgia, "Times New Roman", serif;
  --font-hand: "Caveat", "Segoe Print", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--night); }
body {
  color: var(--cream); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 10px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 980px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 2px 10px; }
.brand { font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: .03em; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: var(--plum); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] .slash { display: none; }

.wrap { position: relative; }
.stage { position: relative; overflow: hidden; border-radius: 20px; background: #0c0a1f; box-shadow: 0 14px 40px rgba(0,0,0,.5); aspect-ratio: 16 / 9; container-type: inline-size; user-select: none; -webkit-user-select: none; }
.view { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1.2s cubic-bezier(.3,.1,.2,1); will-change: transform; }
.view.nomove { transition: none; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.bg.on { opacity: 1; }
.actors, .props { position: absolute; inset: 0; pointer-events: none; }
.actor { position: absolute; transform: translateX(-50%); transition: left 2s linear; filter: drop-shadow(0 6px 6px rgba(10,8,30,.45)); }
.actor img { height: 100%; width: auto; display: block; }
.actor.flip img { transform: scaleX(-1); }
.prop { position: absolute; transform: translateX(-50%); }
.prop img { height: 100%; width: auto; display: block; }
.cg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 18s ease-out forwards; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.07); } }
.tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.4s; }
.tint.dawn { background: linear-gradient(180deg, rgba(255,160,110,.30), rgba(255,215,160,.14)); }
.tint.warm { background: radial-gradient(ellipse at 50% 60%, rgba(255,190,110,.12), rgba(20,10,40,.28)); }
.tint.dim { background: rgba(10,8,35,.32); }
.tint.deep { background: rgba(10,8,35,.58); }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(8,6,25,0) 55%, rgba(8,6,25,.45) 100%); }
#fx, #road { position: absolute; inset: 0; width: 100%; height: 100%; }
#fx { pointer-events: none; }
#road { touch-action: none; }
.fade { position: absolute; inset: 0; background: #15122b; opacity: 0; pointer-events: none; transition: opacity .6s; }
.fade.on { opacity: 1; }

/* Peta hub */
.hub { position: absolute; inset: 0; }
.hubpair { position: absolute; z-index: 1; transform: translate(-50%, -100%); height: 14%; pointer-events: none; transition: left 1.6s ease, top 1.6s ease; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.hubpair img { height: 100%; display: block; }
.spot { position: absolute; z-index: 2; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 0; opacity: .38; cursor: default; }
.spot .pin { width: clamp(30px, 6.4cqw, 54px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: rgba(21,18,43,.78); border: 2px solid rgba(255,211,138,.55); color: var(--gold); }
.spot .pin svg { width: 56%; height: 56%; }
.spot .lbl { font-family: var(--font-display); font-weight: 600; font-size: clamp(10px, 2.1cqw, 15px); letter-spacing: .04em; padding: 1px 9px; border-radius: 999px; background: rgba(21,18,43,.82); color: var(--cream); white-space: nowrap; }
.spot.active { opacity: 1; cursor: pointer; }
.spot.active .pin { background: var(--amber); color: #2b1021; border-color: #fff3e4; animation: pulse 1.6s ease-in-out infinite; }
.spot.done { opacity: 1; }
.spot.done .pin { background: rgba(255,179,92,.9); color: #2b1021; border-color: #fff3e4; box-shadow: 0 0 22px 6px rgba(255,190,110,.7); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,179,92,.7); } 50% { box-shadow: 0 0 0 14px rgba(255,179,92,0); } }

/* Overlay antarmuka */
.ui { position: absolute; inset: 0; display: grid; grid-template-rows: 100%; place-items: center; pointer-events: none; }
.u-panel { background: rgba(21,18,43,.9); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; font-size: clamp(10px, 2.3cqw, 16px); box-shadow: 0 14px 40px rgba(0,0,0,.5); animation: pop .5s ease both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.u-game { width: 64%; overflow: hidden; }
.u-game .bar { display: flex; justify-content: space-between; padding: .5em .9em; background: #2c2c3c; font-weight: 800; }
.u-game .bar span { color: #aab; font-weight: 600; }
.u-game ul { list-style: none; margin: 0; padding: .6em .9em .8em; display: grid; gap: .35em; }
.u-game li { opacity: 0; animation: lineup .5s ease forwards; }
.u-game li b.a { color: var(--gold); } .u-game li b.n { color: var(--rose); }
@keyframes lineup { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.u-chat { width: 72%; height: 78%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.u-chat .bar { display: flex; justify-content: space-between; padding: .5em .9em; background: #2b2d4a; font-weight: 800; }
.u-chat .bar span { color: #9aa0d6; font-weight: 600; }
.u-chat .log { display: flex; flex-direction: column; justify-content: flex-end; gap: .4em; padding: .6em .8em; overflow: hidden; }
.cm { max-width: 80%; padding: .35em .8em; border-radius: .9em; line-height: 1.3; animation: lineup .35s ease both; }
.cm.a { align-self: flex-start; background: #3b3a66; border-bottom-left-radius: .2em; }
.cm.n { align-self: flex-end; background: #7a3a56; border-bottom-right-radius: .2em; }
.u-voice { width: 62%; padding: .9em 1em 1em; text-align: center; }
.u-voice h4 { margin: 0 0 .7em; font-size: 1em; letter-spacing: .08em; text-transform: uppercase; color: var(--mint); display: flex; gap: .5em; align-items: center; justify-content: center; }
.u-voice h4::before { content: ""; width: .6em; aspect-ratio: 1; background: var(--mint); border-radius: 50%; }
.row2 { display: flex; justify-content: center; gap: 12%; }
.ava { display: grid; justify-items: center; gap: .4em; font-weight: 800; }
.ava .face { width: 7.5em; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--plum-2); border: 3px solid rgba(255,255,255,.2); display: grid; place-items: end center; }
.ava .face img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; }
.ava.talk .face { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(110,231,160,.3); }
.u-voice .clock { margin-top: .8em; color: var(--muted); font-weight: 600; }
.u-phone { height: 94%; aspect-ratio: 9 / 17; border-radius: 1.6em; background: #10101c; border: .4em solid #2a2a40; padding: .8em .6em; display: grid; grid-template-rows: auto 1fr; gap: .6em; }
.u-phone .head { text-align: center; font-weight: 800; color: var(--gold); border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: .4em; }
.u-phone .msgs { display: flex; flex-direction: column; gap: .5em; justify-content: flex-start; overflow: hidden; }
.msg { max-width: 82%; padding: .5em .8em; border-radius: 1em; line-height: 1.3; opacity: 0; animation: lineup .5s ease forwards; }
.msg.a { align-self: flex-start; background: #3b3a66; border-bottom-left-radius: .2em; }
.msg.n { align-self: flex-end; background: #7a3a56; border-bottom-right-radius: .2em; }
.u-call { width: 74%; height: 68%; display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: 1fr 1fr; gap: .6em; padding: .6em; }
.tile { border-radius: .8em; background: var(--plum-2); display: grid; place-items: end center; overflow: hidden; position: relative; border: 3px solid transparent; min-height: 0; min-width: 0; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
.tile .nm { position: absolute; left: .5em; bottom: .4em; font-weight: 800; background: rgba(21,18,43,.75); padding: 0 .6em; border-radius: 999px; }
.tile.talk { border-color: var(--mint); }
.tile.mama { grid-row: span 2; background: #f0b7c4; }
.u-board { padding: 1em 1.6em; text-align: center; font-family: var(--font-display); }
.u-board .r { display: flex; gap: 1.2em; justify-content: space-between; align-items: baseline; padding: .3em 0; font-size: 1.3em; }
.u-board .r span { color: var(--muted); font-size: .7em; letter-spacing: .1em; text-transform: uppercase; }
.u-board .old b { text-decoration: line-through; color: #ff7d7d; animation: strike 1s .4s both; }
.u-board .new { opacity: 0; animation: lineup .6s 1.4s forwards; }
.u-board .new b { color: var(--gold); }
@keyframes strike { from { opacity: 1; } to { opacity: .55; } }
.u-ring { pointer-events: none; display: grid; place-items: center; background: rgba(10,8,30,.6); position: absolute; inset: 0; }
.u-ring img { height: 62%; filter: drop-shadow(0 0 22px rgba(255,200,120,.7)); animation: bob 3s ease-in-out infinite; transition: transform .8s; }
.u-ring.zoom img { transform: scale(1.35); }
@keyframes bob { 50% { translate: 0 -2%; } }
.clock-pill { position: absolute; right: 3%; top: 4%; font-family: var(--font-display); font-weight: 600; font-size: clamp(14px, 3.6cqw, 28px); background: rgba(21,18,43,.82); padding: .1em .7em; border-radius: 999px; color: var(--gold); border: 1px solid rgba(255,211,138,.4); z-index: 3; }

.meter { position: absolute; left: 3%; right: 3%; top: 4%; padding: .5em .8em .7em; border-radius: 12px; background: rgba(21,18,43,.85); border: 1px solid rgba(255,255,255,.14); font-size: clamp(10px, 2.2cqw, 14px); z-index: 3; }
.meter .row { display: flex; justify-content: space-between; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.meter .bar { height: .7em; margin-top: .4em; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.meter .fill { height: 100%; width: 90%; border-radius: 6px; background: linear-gradient(90deg, #ffd38a, #ff8fa8); transition: width .9s ease; }

/* Panel komik */
.pan { position: absolute; inset: 4% 5%; display: grid; gap: 2.4%; grid-template-columns: repeat(var(--cols, 1), 1fr); grid-auto-rows: 1fr; z-index: 2; pointer-events: none; }
.pc { margin: 0; position: relative; overflow: hidden; border-radius: 10px; border: 3px solid var(--cream); background: linear-gradient(160deg, var(--c1, #4a3a8a), var(--c2, #2a2150)); box-shadow: 0 8px 22px rgba(0,0,0,.45); animation: panin .55s cubic-bezier(.2,1.3,.4,1) both; display: grid; place-items: end center; }
@keyframes panin { from { opacity: 0; transform: scale(.8) rotate(-2deg); } to { opacity: 1; transform: none; } }
.pc img { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 96%; object-fit: contain; object-position: center bottom; }
.pc .sfx { position: absolute; left: 7%; top: 8%; font-family: var(--font-display); font-weight: 600; font-size: clamp(14px, 4.2cqw, 34px); color: var(--gold); transform: rotate(-6deg); text-shadow: 0 2px 0 #2b1021, 0 0 14px rgba(255,211,138,.6); }
.pc figcaption { position: absolute; left: 0; right: 0; top: 0; padding: .3em .7em; font-weight: 800; font-size: clamp(9px, 1.9cqw, 14px); background: rgba(21,18,43,.78); color: var(--cream); }
.pc.empty { place-items: center; }

/* Mini game: bandara */
.air { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; z-index: 2; background: linear-gradient(0deg, rgba(10,8,30,.35), rgba(10,8,30,0) 60%); }
.airhd { position: absolute; left: 3%; bottom: 3%; font-weight: 800; font-size: clamp(10px, 2.1cqw, 15px); letter-spacing: .1em; text-transform: uppercase; background: rgba(21,18,43,.85); padding: 4px 14px; border-radius: 999px; color: var(--gold); }
.crowd { display: flex; align-items: flex-end; justify-content: space-around; padding: 0 3% 8%; height: 80%; }
.pax { background: none; border: 0; padding: 0; height: 100%; display: flex; align-items: flex-end; animation: paxin .9s ease both; position: relative; }
.pax img { height: 78%; width: auto; display: block; filter: drop-shadow(0 6px 6px rgba(10,8,30,.5)); transition: transform .15s; }
.pax:hover img { transform: translateY(-3%); }
.pax.wrong img { animation: shake .35s; }
.pax.right img { transform: scale(1.12); filter: drop-shadow(0 0 16px var(--gold)); }
@keyframes paxin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.airbtn { position: absolute; right: 3%; bottom: 3%; }

/* Mini game: motor, sinyal, cincin, lentera */
.hudbtns { position: absolute; right: 2%; bottom: 4%; display: grid; gap: 8px; z-index: 3; }
.hudbtns button { width: clamp(40px, 8cqw, 60px); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(21,18,43,.72); display: grid; place-items: center; touch-action: manipulation; }
.hudbtns svg { width: 50%; height: 50%; }
.sigbox { position: absolute; right: 4%; top: 5%; display: flex; align-items: flex-end; gap: 4px; height: clamp(26px, 6cqw, 46px); padding: 6px 10px; border-radius: 10px; background: rgba(21,18,43,.85); z-index: 3; }
.sigbox i { width: clamp(6px, 1.4cqw, 11px); background: rgba(255,255,255,.18); border-radius: 2px; }
.sigbox i:nth-child(1) { height: 25%; } .sigbox i:nth-child(2) { height: 50%; } .sigbox i:nth-child(3) { height: 75%; } .sigbox i:nth-child(4) { height: 100%; }
.sigbox i.on { background: var(--mint); }
.sigbox.low i.on { background: #ff7d7d; }
.sigbar { position: absolute; left: 4%; top: 5%; font-weight: 800; font-size: clamp(10px, 2cqw, 14px); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); background: rgba(21,18,43,.85); padding: 6px 12px; border-radius: 10px; z-index: 3; }
.ringhit { position: absolute; transform: translate(-50%, -50%); width: 17%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,211,138,.08); border: 3px solid rgba(255,238,200,.8); animation: pulse 1.8s ease-in-out infinite; z-index: 3; }
.ringhit:hover { background: rgba(255,211,138,.28); }
.ringhit.done { animation: none; border-color: var(--rose); background: rgba(255,143,168,.25); }
.lan { position: absolute; inset: 0; z-index: 3; }
.lan .lt { position: absolute; bottom: 8%; transform: translateX(-50%); width: 14%; background: none; border: 0; padding: 0; transition: transform 6s ease-in, opacity 6s ease-in, filter .5s; filter: brightness(.55) saturate(.7); }
.lan .lt img { width: 100%; display: block; }
.lan .lt:hover { filter: brightness(.8) saturate(.9); }
.lan .lt.lit { filter: brightness(1.25) drop-shadow(0 0 24px rgba(255,190,100,.95)); }
.lan .lt.fly { transform: translate(-50%, -150%); opacity: 0; pointer-events: none; }
.lan .lt .nm { position: absolute; left: 50%; bottom: -1.6em; transform: translateX(-50%); font-weight: 800; font-size: clamp(9px, 1.8cqw, 13px); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.lcap { position: absolute; left: 6%; right: 6%; top: 6%; text-align: center; font-family: var(--font-card); font-style: italic; font-size: clamp(14px, 3.4cqw, 26px); color: var(--cream); text-shadow: 0 2px 14px rgba(10,8,30,.9); z-index: 4; animation: fadein .8s ease both; }
.lcap small { display: block; font-family: var(--font-body); font-style: normal; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: .5em; color: var(--gold); margin-bottom: .3em; }

.cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4% 6%; gap: .5em; background: linear-gradient(180deg, rgba(21,18,43,.8) 0%, rgba(21,18,43,.35) 55%, rgba(21,18,43,.7) 100%); z-index: 6; }
.cover .eyebrow { font-weight: 800; font-size: clamp(9px, 2cqw, 14px); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.cover h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 7cqw, 52px); line-height: 1.04; text-wrap: balance; text-shadow: 0 3px 18px rgba(21,18,43,.8); }
.cover .sub { margin: 0; font-size: clamp(11px, 2.4cqw, 17px); opacity: .92; }
.cover .btn { margin-top: auto; }
.btn { border: 0; border-radius: 999px; padding: .55em 1.8em; background: var(--rose); color: #2b1021; font-family: var(--font-display); font-weight: 600; font-size: clamp(14px, 3cqw, 20px); letter-spacing: .02em; box-shadow: 0 5px 0 #c85a77, 0 10px 22px rgba(0,0,0,.35); transition: transform .12s, box-shadow .12s; touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c85a77, 0 4px 12px rgba(0,0,0,.35); }
.btn.ghost { background: rgba(255,255,255,.12); color: var(--cream); box-shadow: 0 0 0 1px rgba(255,255,255,.28) inset; font-size: clamp(12px, 2.4cqw, 16px); }
.card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: .3em; padding: 6%; background: rgba(21,18,43,.92); animation: fadein .5s ease both; z-index: 5; }
.card .k { font-weight: 800; font-size: clamp(10px, 2.2cqw, 15px); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.card .t { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 8cqw, 60px); line-height: 1.05; }
.card .rule { width: 56px; height: 3px; border-radius: 3px; background: var(--rose); margin: .5em auto 0; }
.card.crack .t { animation: crack 1.3s ease-in forwards; }
.card.crack .k, .card.crack .rule { animation: crack 1.3s .1s ease-in forwards; }
@keyframes crack { 0% { transform: none; opacity: 1; filter: none; } 15% { transform: translate(-7px, 2px) skewX(6deg); } 30% { transform: translate(8px, -3px) skewX(-8deg); filter: blur(1px); } 50% { transform: translate(-4px, 4px); opacity: .6; } 100% { transform: translateY(18px) scale(.94); opacity: 0; filter: blur(5px); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.actbar { position: absolute; left: 0; right: 0; bottom: 6%; display: flex; justify-content: center; z-index: 5; }
.end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; padding: 5%; gap: .5em; background: linear-gradient(0deg, rgba(21,18,43,.94) 0%, rgba(21,18,43,.5) 50%, rgba(21,18,43,0) 78%); z-index: 5; }
.end h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 6cqw, 44px); line-height: 1.05; text-wrap: balance; }
.end p { margin: 0; opacity: .92; font-size: clamp(11px, 2.4cqw, 17px); }
.end .l { opacity: 0; animation: lineup 1.2s ease forwards; }
.end .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: .4em; opacity: 0; animation: lineup 1s 4.6s ease forwards; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); font-family: var(--font-display); color: var(--muted); z-index: 8; }

function placePair(wait) {
  const hp = $('hubpair'), hr = hubEl.getBoundingClientRect();
  if (!wait || !hr.width) { hp.style.left = '50%'; hp.style.top = '82%'; hp.style.height = wait ? '14%' : '22%'; return; }

/* ---------------- Mesin cerita ---------------- */
let QI = 0;
function next() {
  if (busy) return;
  while (queue.length) { const s = queue.shift(); if (run(s)) return; }
  if (QI < STORY.length) { const s = STORY[QI++]; if (!run(s)) next(); }
}
function sceneSetup(c) {
  if (c.bg) setBG(c.bg);
  dockAuto = c.dock || 'top'; applyDock();
  if (c.cam) setCam(c.cam[0], c.cam[1], c.cam[2]);
  if ('tint' in c) setTint(c.tint);
  clearActors(); clearProps(); hubEl.hidden = true;
  Object.keys(c.actors || {}).forEach(k => addActor(k, Object.assign({ b: 28, h: 19, flip: k === 'nurul' }, c.actors[k])));
  (c.props || []).forEach(addProp);
}
function run(s) {
  if (s.label) return false;
  if (s.hush) { dlg.hidden = true; talkMark(null); busy = true; hushMoment(() => { busy = false; next(); }); return true; }
  if (s.music) { AU.mood = MOOD[s.music] ? s.music : 'happy'; setMusicMood(AU.mood); return false; }
  if (s.call) { s.call(); return false; }
  if (s.card) { showCard(s.card[0], s.card[1], next); return true; }
  if (s.scene) { uiClear(); panClear(); showCG(null); $('clock').hidden = true; sceneSetup(s.scene); return false; }
  if (s.pan !== undefined) { if (s.pan === null) panClear(); else panAdd(s.pan); return false; }
  if (s.hub !== undefined) {
    uiClear(); panClear(); showCG(null); $('clock').hidden = true; talkMark(null);
    babMark(s.hub);
    if (s.hub === 'end') { showHub(null, false); ambient = true; return false; }
    ambient = false; showHub(s.hub, true); showHint('Ketuk tempat yang menyala untuk melanjutkan.'); busy = true; return true;
  }
  if (s.say) { showLine(s.say, s.face, s.text); return true; }
  if (s.ask) { const o = s.shuffle ? s.ask.slice().sort(() => Math.random() - .5) : s.ask; showChoices(o); return true; }
  if (s.game) { ({ chat: () => gameChat(s.rounds), signal: gameSignal, airport: gameAirport, motor: gameMotor, ring: gameRing, lantern: gameLantern })[s.game](); return true; }
  if (s.ui !== undefined) { if (s.ui === null) { uiClear(); return false; } uiShow(s.ui, s); return false; }
  if (s.wait) { dlg.hidden = true; busy = true; setTimeout(() => { busy = false; next(); }, s.wait); return true; }
  if (s.clock !== undefined) { const c = $('clock'); if (s.clock) { c.hidden = false; c.textContent = s.clock; } else c.hidden = true; if (s.tint !== undefined) setTint(s.tint); return false; }
  if (s.fade) { const f = $('fade'); f.classList.add('on'); busy = true; setTimeout(() => { f.classList.remove('on'); busy = false; next(); }, 700); return true; }
  if (s.hearts !== undefined) { ambient = s.hearts; return false; }
  if (s.cg !== undefined) { if (s.cg) { hubEl.hidden = true; hubWait = null; } showCG(s.cg); return false; }
  if (s.meter) {
    const m = s.meter, box = $('meter');
    if (m.hide) { box.hidden = true; meterV = null; return false; }
    if (meterV === null) meterV = 90; box.hidden = false;
    if (m.to != null) meterV = m.to; if (m.add != null) meterV = Math.max(0, Math.min(100, meterV + m.add));
    $('meterf').style.width = meterV + '%'; $('meterv').textContent = Math.round(meterV) + '%'; return false;
  }
  if (s.act === 'ringlook') {
    dlg.hidden = true; busy = true; setBG('map');
    ui.insertAdjacentHTML('beforeend', '<div class="u-ring" id="uring"><img src="' + U('prop_ring') + '" alt=""></div>');
    showAct('Lihat lebih dekat', () => { $('uring').classList.add('zoom'); chime(); burst(50, 50, 22, 'spark'); setTimeout(() => { uiClear(); busy = false; next(); }, 2000); });
    return true;
  }
  if (s.act === 'blow') { actBlow(); return true; }
  if (s.act === 'album') { actAlbum(); return true; }
  if (s.act === 'kartu') { showKartu(() => { busy = false; next(); }); return true; }
  if (s.act === 'fakeend') { actFake(); return true; }
  if (s.act === 'voices') { showVoices(() => { busy = false; next(); }); return true; }
  if (s.act === 'outro') { showOutro(() => { busy = false; next(); }); return true; }
  if (s.act === 'finish') { hubEl.hidden = true; dlg.hidden = true; setupEnd(); $('end').hidden = false; busy = true; burst(50, 70, 50, 'confetti'); ambient = true; return true; }
  return false;
}

/* ---------------- Loop, mulai, ulang ---------------- */
let lastT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - (lastT || now)) / 1000); lastT = now;
  stepParts(dt); drawParts(); if (MG) drawMotor(dt);
  if (!window.__dbg) requestAnimationFrame(frame);
}
function resetAll() {
  hushCancel(); QI = 0; queue = []; busy = false; meterV = null; ambient = false; parts = []; uiClear(); panClear(); showCG(null); stopVoice(); stopOutro();
  if (MG) { finishMotor(true); busy = false; queue = []; }
  document.querySelectorAll('.cardov,.vwall,.air,.lan,.album,.ringhit,.sigbox,.sigbar,.hudbtns').forEach(e => e.remove()); road.hidden = true;
  ['meter', 'end', 'card', 'actbar', 'clock'].forEach(i => { $(i).hidden = true; }); dlg.hidden = true; hubEl.hidden = true; hubWait = null;
  clearActors(); clearProps(); setTint('');
}
function startGame(from) {
  resetAll(); $('cover').hidden = true; audioStart(); warmAll(); AU.mood = 'intro'; setMusicMood('intro');
  if (from) { const i = STORY.findIndex(s => s.label === from); if (i > 0) QI = i; }
  next();
}
$('start').addEventListener('click', () => startGame());
$('replay').addEventListener('click', () => { startGame(); });
$('reletter').addEventListener('click', () => { $('end').hidden = true; showKartu(() => { $('end').hidden = false; busy = true; }); });
$('rahasia').addEventListener('click', () => { $('end').hidden = true; showRahasia(() => { $('end').hidden = false; busy = true; }); });
$('revoice').addEventListener('click', () => { $('end').hidden = true; showVoices(() => { $('end').hidden = false; busy = true; }); });
function setupCover() { setBG('map'); setCam(50, 50, 1, true); setTint('dim'); addActor('alif', { x: 42, b: 14, h: 30, pose: 'a_stand' }); addActor('nurul', { x: 56, b: 14, h: 30, pose: 'n_stand', flip: true }); }
ensure(['bg_map', 'a_stand', 'n_stand', 'heart', 'spark', 'pair_stand']).then(() => {
  $('loading').hidden = true; resizeFx();
  const qs = new URLSearchParams(location.search); window.__dbg = qs.has('dbg');
  if (window.__dbg) setInterval(() => frame((frame.sim = (frame.sim || 0) + 16)), 16); else requestAnimationFrame(frame);
  setupCover();
  const go = qs.get('go');
  if (go) { if (go === 'cover') return; startGame(go); }
});
})();
